name: Применить макеты v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install
      - name: Замена макетов на v2
        run: |
          cp maket/LoginPage-v2.tsx maket/LoginPage.tsx
          cp maket/RegisterPage-v2.tsx maket/RegisterPage.tsx
          cp maket/ResetPasswordPage-v2.tsx maket/ResetPasswordPage.tsx
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('maket').glob('*.tsx'):
              text = path.read_text()
              text = re.sub(r': any\\b', ': unknown', text)
              text = text.replace('err.message ||', '(err instanceof Error ? err.message : "") ||')
              if path.name == 'HeroSection.tsx':
                  text = re.sub(r'\\bFlame,\\s*', '', text)
                  text = re.sub(r'\\bShoppingBag,\\s*', '', text)
                  text = re.sub(r'\\bZap,\\s*', '', text)
                  text = re.sub(r'\\bStar,\\s*', '', text)
              if path.name == 'SearchResults.tsx':
                  text = re.sub(r'\\bArrowUpDown,\\s*', '', text)
                  text = re.sub(r'\\bChevronRight,\\s*', '', text)
                  text = re.sub(r'\\bFilter,\\s*', '', text)
              path.write_text(text)
          PY
      - name: Форматирование
        run: npx prettier --write .
      - name: Проверка ESLint
        run: npm run lint
      - name: Сохранение
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "fix: исправить форматирование проекта"
          git push
