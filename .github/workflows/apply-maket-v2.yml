name: Применить макеты v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install
      - name: Замена макетов на v2
        run: |
          cp maket/LoginPage-v2.tsx maket/LoginPage.tsx
          cp maket/RegisterPage-v2.tsx maket/RegisterPage.tsx
          cp maket/ResetPasswordPage-v2.tsx maket/ResetPasswordPage.tsx
          python - <<'PY'
          from pathlib import Path
          for path in Path('maket').glob('*.tsx'):
              text = path.read_text()
              text = text.replace('catch (err: any)', 'catch (err: unknown)')
              text = text.replace("err.message ||", "(err instanceof Error ? err.message : '') ||")
              if path.name == 'HeroSection.tsx':
                  text = text.replace(', Flame, ShoppingBag, Zap, Star', '')
              if path.name == 'SearchResults.tsx':
                  text = text.replace('ArrowUpDown, ', '')
                  text = text.replace('ChevronRight, ', '')
                  text = text.replace('Filter, ', '')
                  text = text.replace(' as any)', " as 'score' | 'price_asc' | 'price_desc')")
              if path.name in {'LoginPage.tsx', 'LoginPage-v2.tsx'}:
                  text = text.replace(', ShieldCheck,', ',')
              path.write_text(text)
          PY
      - name: Форматирование
        run: npx prettier --write maket src/app/'(auth)'
      - name: Проверка ESLint
        run: npm run lint
      - name: Сохранение
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maket
          git diff --cached --quiet || git commit -m "fix: исправить ошибки макетов v2"
          git push
