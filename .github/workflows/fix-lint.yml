name: Одноразовое исправление ESLint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install
      - name: Исправление ESLint
        run: npx eslint . --fix
      - name: Сохранение исправлений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maket
          git diff --cached --quiet || git commit -m "fix: исправить ошибки ESLint в макетах"
          git push
