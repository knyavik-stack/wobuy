name: Проверка WOBuy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm ci

      - name: Автоматическое форматирование
        run: npm run format

      - name: Проверка TypeScript
        run: npm run typecheck

      - name: Проверка ESLint
        run: npm run lint

      - name: Проверка форматирования
        run: npm run format:check

      - name: Production build
        run: npm run build
