name: Deploy Next.js to Yandex Cloud

on:
  push:
    branches:
      - main  # Если ветка master, замените main на master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="cr.yandex/${{ vars.YC_REGISTRY_ID }}/nextjs-app:latest"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy via YC CLI
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > key.json
          
          # Устанавливаем консоль Яндекса напрямую, минуя кривые плагины
          curl -sSL https://yandexcloud.net | bash -s -- -i $HOME/yandex-cloud -n
          export PATH=$PATH:$HOME/yandex-cloud/bin
          
          # Авторизуемся под роботом
          yc config profile create sa-profile
          yc config set service-account-key key.json
          yc config set folder-id ${{ vars.YC_FOLDER_ID }}
          
          # Обновляем контейнер прямой командой
          yc serverless container revisions deploy \
            --container-name 'wobuy-site' \
            --image cr.yandex/${{ vars.YC_REGISTRY_ID }}/nextjs-app:latest \
            --cores 1 \
            --memory 256MB \
            --concurrency 10 \
            --execution-timeout 30s \
            --service-account-id ${{ vars.YC_SA_ID }}
