name: Форматирование WOBuy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Форматирование
        run: npx --yes prettier@3.6.2 --write .

      - name: Сохранение форматирования
        run: |
          if git diff --quiet; then
            echo "Изменений форматирования нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: форматирование Prettier"
          git push origin HEAD:main
